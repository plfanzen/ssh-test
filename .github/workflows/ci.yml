name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
    
    - name: Build Docker image for testing
      run: docker build -t ssh-server .
    
    - name: Run SSH server container
      run: |
        docker run -d --name ssh-test -p 2222:22 ssh-server
        # Wait for SSH service to be ready with retries
        for i in {1..30}; do
          if sshpass -p 'plfanzy' ssh -o StrictHostKeyChecking=no -o ConnectTimeout=2 -p 2222 plfanzen@localhost 'exit' 2>/dev/null; then
            echo "SSH service is ready"
            break
          fi
          echo "Waiting for SSH service... ($i/30)"
          sleep 1
        done
    
    - name: Install SSH client
      run: sudo apt-get update && sudo apt-get install -y sshpass
    
    - name: Test SSH connection
      run: |
        sshpass -p 'plfanzy' ssh -o StrictHostKeyChecking=no -p 2222 plfanzen@localhost 'echo "SSH connection successful!"'
    
    - name: Check SSH server logs
      if: always()
      run: docker logs ssh-test
    
    - name: Stop container
      if: always()
      run: docker stop ssh-test && docker rm ssh-test
